name: Deploy production

on:
  workflow_run:
    workflows:
      - CI checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_ci_verification:
        description: "Срочный выпуск без CI checks: тесты прогнаны локально"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  SITE_URL: https://asyl-ltd.kz

jobs:
  verify:
    name: Verify release CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Note an urgent release without CI checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_ci_verification }}
        run: echo "::warning::Release $RELEASE_SHA deployed without CI checks (manual urgent release)."
      - name: Require successful checks for this exact commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci_verification) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-checks.yml/runs?head_sha=$RELEASE_SHA&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python deploy/verify-release-ci.py "$RELEASE_SHA" "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ci-runs.json"

  build-backend:
    name: Build and push backend image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      backend_digest: ${{ steps.backend_image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        id: backend_image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build:
    name: Build and push frontend image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        id: frontend_image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_APP_RELEASE=${{ env.RELEASE_SHA }}
            NEXT_PUBLIC_APP_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_ENABLE_LOGS=0
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT_FRONTEND }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ghcr.io/${{ github.repository }}-frontend:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: [build, build-backend]
    permissions:
      contents: read
      packages: read
    outputs:
      public_gates_passed: ${{ steps.frontend_gate.outputs.passed }}
    # Бюджет worst-case: ожидание SSH, два 15-минутных ожидания remote flock,
    # два полных прогона deploy и публичные health gates. Откат провала и
    # завершение после таймаута выполняет отдельный job recovery.
    timeout-minutes: 90
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
      PROD_USER: ${{ secrets.PROD_USER || 'ubuntu' }}
      PROD_APP_DIR: /home/${{ secrets.PROD_USER || 'ubuntu' }}/asyl-ltd
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WAGON_SCALE_API_URL: ${{ secrets.WAGON_SCALE_API_URL }}
      TRUCK_SCALE_API_URL: ${{ secrets.TRUCK_SCALE_API_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SHIPPING_WAGON_AI_MODEL: ${{ vars.SHIPPING_WAGON_AI_MODEL }}
      SHIPPING_WAGON_AI_DETAIL: ${{ vars.SHIPPING_WAGON_AI_DETAIL }}
      BACKEND_IMAGE_REF: ghcr.io/${{ github.repository }}-backend@${{ needs.build-backend.outputs.backend_digest }}
      FRONTEND_IMAGE_REF: ghcr.io/${{ github.repository }}-frontend@${{ needs.build.outputs.frontend_digest }}

    steps:
      # Только общая SSH/health-обвязка проверенного коммита.
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: deploy/ci
          persist-credentials: false

      - name: Validate production deployment configuration
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh

          validate_prod_target
          fail_if_empty BACKEND_IMAGE_REF "$BACKEND_IMAGE_REF"
          fail_if_empty FRONTEND_IMAGE_REF "$FRONTEND_IMAGE_REF"
          test "$PROD_APP_DIR" = "/home/$PROD_USER/asyl-ltd"

      - name: Deploy over SSH
        id: deploy_release
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh

          # Both scale endpoints are optional, but explicit empty values must
          # still reach the host to disable a stale source deterministically.
          # They and the registry token are streamed over SSH stdin, never
          # embedded in the remote process command line.
          WAGON_SCALE_API_URL_B64=$(b64 "$WAGON_SCALE_API_URL")
          TRUCK_SCALE_API_URL_B64=$(b64 "$TRUCK_SCALE_API_URL")
          OPENAI_API_KEY_B64=$(b64 "$OPENAI_API_KEY")
          SHIPPING_WAGON_AI_MODEL_B64=$(b64 "$SHIPPING_WAGON_AI_MODEL")
          SHIPPING_WAGON_AI_DETAIL_B64=$(b64 "$SHIPPING_WAGON_AI_DETAIL")

          setup_ssh_key

          # Extract the candidate deploy runner from the verified commit into
          # a host-only directory. The worktree is not changed until that
          # runner has acquired flock and persisted rollback state.
          deploy() {
            printf '%s\n%s\n%s\n%s\n%s\n%s\n' "$GHCR_TOKEN" "$WAGON_SCALE_API_URL_B64" "$TRUCK_SCALE_API_URL_B64" "$OPENAI_API_KEY_B64" "$SHIPPING_WAGON_AI_MODEL_B64" "$SHIPPING_WAGON_AI_DETAIL_B64" \
              | run_ssh \
              "set -eu \
               && IFS= read -r GHCR_TOKEN \
               && IFS= read -r WAGON_SCALE_API_URL_B64 \
               && IFS= read -r TRUCK_SCALE_API_URL_B64 \
               && IFS= read -r OPENAI_API_KEY_B64 \
               && IFS= read -r SHIPPING_WAGON_AI_MODEL_B64 \
               && IFS= read -r SHIPPING_WAGON_AI_DETAIL_B64 \
               && export OPENAI_API_KEY_B64 SHIPPING_WAGON_AI_MODEL_B64 SHIPPING_WAGON_AI_DETAIL_B64 \
               && export GHCR_TOKEN WAGON_SCALE_API_URL_B64 TRUCK_SCALE_API_URL_B64 \
               && cd '$PROD_APP_DIR' \
               && state_dir=.deploy-state \
               && test ! -L \"\$state_dir\" \
               && mkdir -p \"\$state_dir\" \
               && chmod 700 \"\$state_dir\" \
               && test \"\$(stat -c '%u' \"\$state_dir\")\" = \"\$(id -u)\" \
               && git_auth_header=\$(printf 'x-access-token:%s' \"\$GHCR_TOKEN\" | base64 | tr -d '\n') \
               && GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                  GIT_CONFIG_VALUE_0=\"AUTHORIZATION: basic \$git_auth_header\" \
                  GIT_TERMINAL_PROMPT=0 \
                  git fetch origin main \
               && unset git_auth_header \
               && test \"\$(git rev-parse origin/main)\" = '$RELEASE_SHA' \
               && runner=\"\$state_dir/candidate-$RELEASE_SHA.runner\" \
               && incoming=\"\$runner.incoming.\$\$\" \
               && trap 'rm -f \"\$incoming\"' EXIT \
               && umask 077 \
               && git show '$RELEASE_SHA:deploy/remote-deploy.sh' >\"\$incoming\" \
               && chmod 700 \"\$incoming\" \
               && mv -f \"\$incoming\" \"\$runner\" \
               && sync \
               && trap - EXIT \
               && APP_DIR='$PROD_APP_DIR' \
                  BRANCH=main \
                  EXPECTED_SHA='$RELEASE_SHA' \
                  GHCR_USER='$GHCR_USER' \
                  BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' \
                  FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' \
                  \"\$runner\""
          }

          wait_for_ssh

          # Одна повторная попытка: покрывает обрыв связи или перезагрузку
          # посреди деплоя. Перед ретраем снова ждём SSH — сервер мог уйти
          # в ребут на несколько минут.
          if ! deploy; then
            echo "Деплой не удался — ждём сервер и пробуем ещё раз…"
            sleep 30
            wait_for_ssh
            deploy
          fi

          # The compose healthcheck of camera-monitor proves only that its
          # loop is alive, not that cameras are healthy. This durable probe
          # also blocks while the /events cursor is pending, stale or failed,
          # so an incomplete backlog can never be finalized as a healthy
          # release. Any non-zero exit fails the job, and recovery rolls back.
          # Take the boundary from the production host after container startup
          # to avoid clock skew and any final heartbeat from the old monitor.
          candidate_health_epoch=$(run_ssh date +%s)
          candidate_health_epoch=$((candidate_health_epoch + 1))
          run_ssh \
            "cd '$PROD_APP_DIR' \
             && CAMERA_HEALTH_REQUIRE_SINCE_EPOCH='$candidate_health_epoch' \
                ./deploy/health/wait-for-camera-health.sh"

      - name: Health check
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh
          wait_for_public_api

      - name: Frontend redirect safety gate
        id: frontend_gate
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh

          inspect_login_flow
          echo "Frontend serves the expected login flow without foreign redirects."
          echo "passed=true" >>"$GITHUB_OUTPUT"

      - name: Finalize healthy release and clean Docker artifacts
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh

          finalize() {
            run_ssh \
              "cd '$PROD_APP_DIR' \
               && runner=./.deploy-state/release-state.runner \
               && test -f \"\$runner\" && test ! -L \"\$runner\" && test -x \"\$runner\" \
               && APP_DIR='$PROD_APP_DIR' \
                  EXPECTED_SHA='$RELEASE_SHA' \
                  BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' \
                  FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' \
                  \"\$runner\" finalize"
          }

          if ! finalize; then
            echo "Finalize command failed — retrying once after 30s…"
            sleep 30
            finalize
          fi

  # Единственный путь отката: любой провал, отмена или таймаут job deploy.
  # Кандидат, не прошедший публичные проверки, откатывается; прошедший их —
  # перепроверяется и финализируется.
  recovery:
    name: Recover failed or timed-out production deploy
    needs: [build, build-backend, deploy]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.build-backend.result == 'success' &&
      needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
      PROD_USER: ${{ secrets.PROD_USER || 'ubuntu' }}
      PROD_APP_DIR: /home/${{ secrets.PROD_USER || 'ubuntu' }}/asyl-ltd
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WAGON_SCALE_API_URL: ${{ secrets.WAGON_SCALE_API_URL }}
      TRUCK_SCALE_API_URL: ${{ secrets.TRUCK_SCALE_API_URL }}
      BACKEND_IMAGE_REF: ghcr.io/${{ github.repository }}-backend@${{ needs.build-backend.outputs.backend_digest }}
      FRONTEND_IMAGE_REF: ghcr.io/${{ github.repository }}-frontend@${{ needs.build.outputs.frontend_digest }}
      RECOVERY_ACTION: ${{ needs.deploy.outputs.public_gates_passed == 'true' && 'finalize' || 'rollback' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: deploy/ci
          persist-credentials: false

      - name: Restore previous release independently
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh

          validate_prod_target
          test "$PROD_APP_DIR" = "/home/$PROD_USER/asyl-ltd"

          WAGON_SCALE_API_URL_B64=$(b64 "$WAGON_SCALE_API_URL")
          TRUCK_SCALE_API_URL_B64=$(b64 "$TRUCK_SCALE_API_URL")
          setup_ssh_key

          # The candidate runner is copied outside the Git checkout before
          # containers change. It remains available after rollback restores
          # the previous commit.
          recover() {
            printf '%s\n%s\n%s\n' "$GHCR_TOKEN" "$WAGON_SCALE_API_URL_B64" "$TRUCK_SCALE_API_URL_B64" \
              | run_ssh \
              "set -eu \
               && IFS= read -r GHCR_TOKEN \
               && IFS= read -r WAGON_SCALE_API_URL_B64 \
               && IFS= read -r TRUCK_SCALE_API_URL_B64 \
               && export GHCR_TOKEN WAGON_SCALE_API_URL_B64 TRUCK_SCALE_API_URL_B64 \
               && cd '$PROD_APP_DIR' \
               && state=./.deploy-state/release-state \
               && transaction_runner=\"\$state.runner\" \
               && candidate_runner=./.deploy-state/candidate-$RELEASE_SHA.runner \
               && if [ '$RECOVERY_ACTION' = rollback ] && [ ! -e \"\$state\" ] \
                    && [ ! -e \"\$candidate_runner\" ]; then \
                    echo 'Candidate runner was never published; nothing crossed the durable state boundary.'; \
                    exit 0; \
                  fi \
               && if [ '$RECOVERY_ACTION' = finalize ] || [ -e \"\$state\" ]; then \
                    runner=\"\$transaction_runner\"; \
                  else runner=\"\$candidate_runner\"; fi \
               && test -f \"\$runner\" && test ! -L \"\$runner\" && test -x \"\$runner\" \
               && APP_DIR='$PROD_APP_DIR' \
                  EXPECTED_SHA='$RELEASE_SHA' \
                  GHCR_USER='$GHCR_USER' \
                  BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' \
                  FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' \
                  \"\$runner\" '$RECOVERY_ACTION'"
          }

          wait_for_ssh
          if [ "$RECOVERY_ACTION" = "finalize" ]; then
            echo "Revalidating the candidate before irreversible finalization…"
            if ! verify_public_health; then
              echo "Candidate degraded after the earlier gate; switching recovery to rollback."
              RECOVERY_ACTION=rollback
            fi
          fi

          if ! recover; then
            echo "Independent $RECOVERY_ACTION failed; waiting and retrying once."
            sleep 30
            wait_for_ssh
            recover
          fi

          # Compose health is necessary but not sufficient. Verify the restored
          # or finalized release through the public ingress.
          verify_public_health
          echo "Independent recovery completed $RECOVERY_ACTION and verified public health."
