name: Activate independent weighbridge collector
on:
  workflow_dispatch:
    inputs:
      upgrade:
        description: Update the collector image on a freshly empty scale
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
      PROD_USER: ${{ secrets.PROD_USER || 'ubuntu' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      UPGRADE_COLLECTOR: ${{ inputs.upgrade }}
    steps:
      - uses: actions/checkout@v6
      - name: Activate only on a freshly empty scale
        shell: bash
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh
          validate_prod_target
          setup_ssh_key
          trap 'rm -f "$PROD_SSH_KEY_FILE" "$PROD_KNOWN_HOSTS_FILE"' EXIT
          collector_action=""
          if [ "$UPGRADE_COLLECTOR" = "true" ]; then collector_action="upgrade"; fi
          run_ssh "cd '/home/$PROD_USER/asyl-ltd' && sh -s -- $collector_action" < deploy/weighbridge/install.sh
