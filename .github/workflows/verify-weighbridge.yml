name: Verify production weighbridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-weighbridge-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
      PROD_USER: ${{ secrets.PROD_USER || 'ubuntu' }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6
      - name: Audit saved weights and test vision without changing trips
        shell: bash
        run: |
          set -euo pipefail
          . deploy/ci/prod-lib.sh
          validate_prod_target
          setup_ssh_key
          # Stream the reviewed diagnostic module with its entrypoint. No
          # source files or credentials are installed on the production host.
          python - <<'PY' > "$RUNNER_TEMP/verify.py"
          from pathlib import Path
          wrapper = Path('deploy/verify-weighbridge.py').read_text()
          injection = 'import types\nimport apps.grain\n'
          for name in ('weighing_identity', 'weighing_audit'):
              source = Path('backend/apps/grain/' + name + '.py').read_text()
              injection += "module = types.ModuleType('apps.grain." + name + "')\nmodule.__package__ = 'apps.grain'\nexec(" + repr(source) + ", module.__dict__)\nsys.modules[module.__name__] = module\nsetattr(apps.grain, '" + name + "', module)\n"
          print(wrapper.replace('from apps.grain.weighing_audit import snapshot, probe', injection + '\nfrom apps.grain.weighing_audit import snapshot, probe'))
          PY
          run_ssh \
            "cd '/home/$PROD_USER/asyl-ltd' && docker compose -f docker-compose.prod.yml exec -T backend python -" \
            < "$RUNNER_TEMP/verify.py" | tee "$RUNNER_TEMP/weighbridge.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighbridge-verification
          path: ${{ runner.temp }}/weighbridge.json
          retention-days: 3
