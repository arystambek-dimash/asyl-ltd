services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asyl
      POSTGRES_USER: asyl
      POSTGRES_PASSWORD: asyl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    environment: &backend-environment
      DB_NAME: asyl
      DB_USER: asyl
      DB_PASSWORD: asyl
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "1"
      APP_RELEASE: "${APP_RELEASE:-development}"
      APP_ENVIRONMENT: "${APP_ENVIRONMENT:-development}"
      APP_SERVICE: backend
      LOG_FORMAT: "${LOG_FORMAT:-readable}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SENTRY_BACKEND_DSN: "${SENTRY_BACKEND_DSN:-}"
      SENTRY_ENABLE_LOGS: "${SENTRY_ENABLE_LOGS:-0}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      SENTRY_PROFILES_SAMPLE_RATE: "${SENTRY_PROFILES_SAMPLE_RATE:-0}"
      ALLOWED_HOSTS: "*"  # сервер в локальной сети цеха — доступен по своему IP
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379/0"
      # Keep broker queues isolated from Django cache keys while reusing the
      # same Redis service. No Celery result backend is configured.
      CELERY_BROKER_URL: "redis://redis:6379/1"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-admin@asyl.local}"
      # Development-only default that still passes Django's validators.
      SUPER_ADMIN_PASS: "${SUPER_ADMIN_PASS:-Local-only-Q7v9-Pass!}"
      SUPER_ADMIN_RESET_PASSWORD: "${SUPER_ADMIN_RESET_PASSWORD:-0}"
      # Камеры и AI-подсчёт: для локальной отладки укажите хосты в .env
      # (host.docker.internal — мок на маке); пусто = функции выключены.
      CAMERA_HOST: "${CAMERA_HOST:-}"
      CAMERA_PORT: "${CAMERA_PORT:-8554}"
      CAMERA_PASS: "${CAMERA_PASS:-}"
      # Deployment-only migration boundary: the container receives canonical
      # names even when an existing host .env still contains CAMERA_AI_*.
      AI_SERVICE_URL: "${AI_SERVICE_URL:-${CAMERA_AI_URL:-}}"
      AI_SERVICE_API_KEY: "${AI_SERVICE_API_KEY:-${CAMERA_AI_KEY:-}}"
      AI_SERVICE_TIMEOUT: "${AI_SERVICE_TIMEOUT:-25}"
      CONVEYOR_AI_CALLBACK_TOKEN_SHA256: "${CONVEYOR_AI_CALLBACK_TOKEN_SHA256:-}"
      CONVEYOR_DEVICE_SYNC_MS: "${CONVEYOR_DEVICE_SYNC_MS:-500}"
      CONVEYOR_DEVICE_LEASE_MS: "${CONVEYOR_DEVICE_LEASE_MS:-1200}"
      CONVEYOR_DEVICE_FRESH_MS: "${CONVEYOR_DEVICE_FRESH_MS:-1500}"
      CONVEYOR_AI_STALE_MS: "${CONVEYOR_AI_STALE_MS:-1500}"
      CONVEYOR_COMMAND_TIMEOUT_SECONDS: "${CONVEYOR_COMMAND_TIMEOUT_SECONDS:-5}"
      CONVEYOR_NO_PROGRESS_SECONDS: "${CONVEYOR_NO_PROGRESS_SECONDS:-15}"
      CONVEYOR_MAX_RUN_SECONDS: "${CONVEYOR_MAX_RUN_SECONDS:-300}"
      THROTTLE_CONVEYOR_DEVICE: "${THROTTLE_CONVEYOR_DEVICE:-180/min}"
      THROTTLE_CONVEYOR_AI: "${THROTTLE_CONVEYOR_AI:-6000/min}"
      # Пусто по умолчанию: локальная разработка не должна читать production
      # весы. Для интеграционной проверки задайте адрес в .env.
      TRUCK_SCALE_API_URL: "${TRUCK_SCALE_API_URL:-}"
      TRUCK_SCALE_TIMEOUT_SECONDS: "${TRUCK_SCALE_TIMEOUT_SECONDS:-3}"
      TRUCK_SCALE_PREVIEW_TIMEOUT_SECONDS: "${TRUCK_SCALE_PREVIEW_TIMEOUT_SECONDS:-1}"
      TRUCK_SCALE_MAX_AGE_SECONDS: "${TRUCK_SCALE_MAX_AGE_SECONDS:-5}"
      TRUCK_SCALE_MAX_WEIGHT_KG: "${TRUCK_SCALE_MAX_WEIGHT_KG:-100000}"
      THROTTLE_TRUCK_SCALE_PREVIEW: "${THROTTLE_TRUCK_SCALE_PREVIEW:-120/min}"
      CAMERA_PLAYBACK_URL: "${CAMERA_PLAYBACK_URL:-}"
      GO2RTC_API_URL: "${GO2RTC_API_URL:-}"
      APIPAY_API_KEY: "${APIPAY_API_KEY:-}"
      APIPAY_WEBHOOK_SECRET: "${APIPAY_WEBHOOK_SECRET:-}"
      APIPAY_BASE_URL: "${APIPAY_BASE_URL:-https://api.apipay.kz/api/v1}"
      APIPAY_TIMEOUT_SECONDS: "${APIPAY_TIMEOUT_SECONDS:-10}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - mediadata:/app/media
    ports:
      - "8000:8000"

  celery-payments:
    build: ./backend
    environment:
      <<: *backend-environment
      APP_SERVICE: celery-payments
      DJANGO_COLLECTSTATIC: "0"
    entrypoint: []
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --queues=payments
      - --concurrency=1
      - --prefetch-multiplier=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "python", "/app/apipay_monitor_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  celery-beat:
    build: ./backend
    environment:
      <<: *backend-environment
      APP_SERVICE: celery-beat
      DJANGO_COLLECTSTATIC: "0"
      CELERY_BEAT_PID_FILE: /tmp/celerybeat/celerybeat.pid
    entrypoint: []
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat/celerybeat-schedule
      - --pidfile=/tmp/celerybeat/celerybeat.pid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    tmpfs:
      - /tmp/celerybeat:rw,noexec,nosuid,nodev,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "/app/celery_beat_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
        NEXT_PUBLIC_APP_RELEASE: "${APP_RELEASE:-development}"
        NEXT_PUBLIC_APP_ENVIRONMENT: "${APP_ENVIRONMENT:-development}"
        NEXT_PUBLIC_SENTRY_ENABLE_LOGS: "${NEXT_PUBLIC_SENTRY_ENABLE_LOGS:-0}"
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}"
        SENTRY_ORG: "${SENTRY_ORG:-}"
        SENTRY_PROJECT: "${SENTRY_PROJECT_FRONTEND:-}"
    environment:
      APP_RELEASE: "${APP_RELEASE:-development}"
      APP_ENVIRONMENT: "${APP_ENVIRONMENT:-development}"
      APP_SERVICE: frontend-server
      SENTRY_FRONTEND_SERVER_DSN: "${SENTRY_FRONTEND_SERVER_DSN:-}"
      SENTRY_ENABLE_LOGS: "${SENTRY_FRONTEND_ENABLE_LOGS:-0}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_FRONTEND_TRACES_SAMPLE_RATE:-0}"
      SENTRY_PROFILES_SAMPLE_RATE: "${SENTRY_FRONTEND_PROFILES_SAMPLE_RATE:-0}"
    depends_on:
      - backend
    ports:
      - "3000:3000"


  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Almaty
      - SERVERURL=${WG_SERVERURL:-78.40.109.240}
      - SERVERPORT=${WG_SERVERPORT:-51820}
      - PEERS=${WG_PEERS:-operator-laptop}
      - PEERDNS=${WG_PEERDNS:-1.1.1.1}
      - INTERNAL_SUBNET=${WG_INTERNAL_SUBNET:-10.13.13.0}
      # Split tunnel: VPN subnet + camera LAN only. Replace camera LAN in .env.
      - ALLOWEDIPS=${WG_ALLOWEDIPS:-10.13.13.0/24,192.168.1.0/24}
      - PERSISTENTKEEPALIVE_PEERS=${WG_PERSISTENTKEEPALIVE_PEERS:-all}
      - LOG_CONFS=true
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mediadata:
