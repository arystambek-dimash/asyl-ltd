# Общие заголовки проксирования к бэкенду/фронтенду: исходный Host, IP клиента
# и схема. Подключается внутри location — на уровень server не поднимать:
# location со своими proxy_set_header (/, /go2rtc/) перестал бы их наследовать.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
