# Базовые security-заголовки ставит только nginx. Копии от апстрима (Django
# SecurityMiddleware/XFrameOptionsMiddleware, Next headers()) скрываются —
# иначе в ответе два значения (два разных X-Frame-Options или HSTS), и браузер
# может проигнорировать оба. CSP остаётся за Next: он знает свои страницы.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self) — голосовые задачи записываются прямо в браузере. Пустой
# список запрещал запись всему сайту: браузер отказывал, даже не спросив
# сотрудника. Камера и геолокация остаются закрытыми — они не нужны.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
